name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The API tests talk to a real PostgreSQL rather than a mock, so the
    # ordering rules and the cascades are exercised the way they run in production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban_test?schema=public
      TEST_DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban_test?schema=public
      JWT_SECRET: ci-secret-value-long-enough-for-validation
      CLIENT_URL: http://localhost:5173
      COOKIE_SAMESITE: lax
      TRUST_PROXY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace server

      - name: Lint and check formatting
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
